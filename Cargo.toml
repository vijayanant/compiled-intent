[package]
name = "compiled-intent"
version = "0.1.0"
edition = "2021"
description = "A Universal Semantic Memory Layer for AI Agents"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
pulldown-cmark = "0.13.4"
lancedb = "0.37.1"
arrow = "58.4.0"
sha2 = "0.10"
serde_yaml = "0.9"
futures = "0.3.34"
