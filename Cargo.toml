[workspace]
members = [
    "crates/engine",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.2.0-dev"
edition = "2021"
authors = ["Vijay Anant <vijay.hassan@gmail.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.42.0", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
serde_yaml = "0.9"
pulldown-cmark = "0.13.4"
lancedb = "0.37.1"
lance-index = "10.0.0"
arrow = "58.4.0"
sha2 = "0.10"
futures = "0.3.34"
toml = "1.1.4"
reqwest = { version = "0.13.4", features = ["json"] }
clap = { version = "4.6.6", features = ["derive"] }
walkdir = "2.5.0"

[workspace.lints.clippy]
cognitive_complexity = "warn"
too_many_arguments = "warn"
too_many_lines = "warn"
disallowed_names = "deny"
doc_markdown = "warn"

[profile.release]
opt-level = 3
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
