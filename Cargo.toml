[package]
name = "compiled-intent"
version = "0.1.0"
edition = "2021"
description = "A Universal Semantic Memory Layer for AI Agents"

[dependencies]
tokio = { version = "1.42.0", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
pulldown-cmark = "0.13.4"
lancedb = "0.37.1"
arrow = "58.4.0"
sha2 = "0.10"
serde_yaml = "0.9"
futures = "0.3.34"
toml = "1.1.4"
reqwest = { version = "0.13.4", features = ["json"] }
clap = { version = "4.6.6", features = ["derive"] }
walkdir = "2.5.0"
lance-index = "10.0.0"

[[bin]]
name = "intent"
path = "src/main.rs"
